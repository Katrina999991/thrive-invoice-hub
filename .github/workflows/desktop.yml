name: Build GestionFlow desktop apps

on:
  workflow_dispatch:
  push:
    branches: [desktop-app]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: gestionflow-linux
            path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: windows-latest
            artifact: gestionflow-windows
            path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact: gestionflow-macos
            path: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf rpm \
            createrepo-c gnupg

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        run: npm run tauri:build

      - name: Add Apache SPA fallback for WHC
        shell: bash
        run: |
          node -e "require('fs').copyFileSync('public/.htaccess', 'dist/.htaccess')"
          mkdir -p dist/rpm
          node -e "require('fs').copyFileSync('public/rpm/.htaccess', 'dist/rpm/.htaccess')"

      - name: Add Linux packages to website downloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/downloads
          cp src-tauri/target/release/bundle/deb/*.deb dist/downloads/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist/downloads/
          ls -la dist/downloads

      - name: Build signed RPM repository
        if: runner.os == 'Linux'
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
          RPM_GPG_KEY_ID: ${{ secrets.RPM_GPG_KEY_ID }}
        run: bash scripts/build-rpm-repo.sh

      - name: Upload RPM repository for WHC
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: gestionflow-rpm-repo
          path: rpm-repo
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14


  package-web:
    name: Package complete web files for WHC
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web files
        run: npm run build

      - name: Download native installers and RPM repository
        uses: actions/download-artifact@v5
        with:
          pattern: gestionflow-*
          path: native-artifacts

      - name: Assemble complete WHC web files
        shell: bash
        run: |
          cp public/.htaccess dist/.htaccess
          rm -rf dist/rpm
          mkdir -p dist/downloads dist/rpm

          find native-artifacts/gestionflow-linux -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/downloads/ \;
          find native-artifacts/gestionflow-windows -type f \
            \( -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} dist/downloads/ \;
          find native-artifacts/gestionflow-macos -type f -name '*.dmg' \
            -exec cp {} dist/downloads/ \;
          cp -R native-artifacts/gestionflow-rpm-repo/. dist/rpm/

          # WHC may reject direct executable downloads. Provide a ZIP that
          # contains the Windows installers while keeping the native files.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          windows_files = list(Path("native-artifacts/gestionflow-windows").rglob("*.exe"))
          windows_files += list(Path("native-artifacts/gestionflow-windows").rglob("*.msi"))
          with ZipFile("dist/downloads/GestionFlow_0.1.1_windows.zip", "w", ZIP_DEFLATED) as archive:
              for file in windows_files:
                  archive.write(file, file.name)
          PY

          find dist/downloads dist/rpm -type f | sort

      - name: Record web bundle entry file
        id: web-bundle
        shell: bash
        run: echo "asset=$(grep -Eo 'assets/[^\" ]+\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload complete web files for WHC
        uses: actions/upload-artifact@v5
        with:
          name: gestionflow-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Prepare WHC deployment directory
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TARGET: ${{ secrets.WHC_SSH_TARGET }}
        with:
          host: ${{ secrets.WHC_SSH_HOST }}
          username: ${{ secrets.WHC_SSH_USER }}
          port: ${{ secrets.WHC_SSH_PORT }}
          key: ${{ secrets.WHC_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.WHC_SSH_PASSPHRASE }}
          envs: DEPLOY_TARGET
          script: |
            set -e
            mkdir -p "$DEPLOY_TARGET"
            # Remove the nested directory created by the previous SCP layout.
            rm -rf "$DEPLOY_TARGET/dist"
            # Remove only stale RPM metadata; do not remove the website root.
            rm -rf "$DEPLOY_TARGET/rpm/x86_64/repodata"

      - name: Deploy complete web files to WHC
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.WHC_SSH_HOST }}
          username: ${{ secrets.WHC_SSH_USER }}
          port: ${{ secrets.WHC_SSH_PORT }}
          key: ${{ secrets.WHC_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.WHC_SSH_PASSPHRASE }}
          # Copy the contents of dist into the domain root, including the
          # hidden Apache fallback file, rather than creating a nested dist/.
          source: "dist"
          target: ${{ secrets.WHC_SSH_TARGET }}/
          strip_components: 1
          overwrite: true

      - name: Verify WHC web root
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TARGET: ${{ secrets.WHC_SSH_TARGET }}
          EXPECTED_ASSET: ${{ steps.web-bundle.outputs.asset }}
        with:
          host: ${{ secrets.WHC_SSH_HOST }}
          username: ${{ secrets.WHC_SSH_USER }}
          port: ${{ secrets.WHC_SSH_PORT }}
          key: ${{ secrets.WHC_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.WHC_SSH_PASSPHRASE }}
          envs: DEPLOY_TARGET,EXPECTED_ASSET
          script: |
            set -e
            test -f "$DEPLOY_TARGET/index.html"
            ACTUAL_ASSET=$(grep -Eo 'assets/[^" ]+\.js' "$DEPLOY_TARGET/index.html" | head -1)
            echo "Expected asset: $EXPECTED_ASSET"
            echo "WHC target asset: $ACTUAL_ASSET"
            test "$ACTUAL_ASSET" = "$EXPECTED_ASSET"
